<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One P2p</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0e11;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            background: #181a20;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: #181a20;
            border-bottom: 1px solid #23272f;
        }
        .app-header .left {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 20px;
            font-weight: 500;
            cursor: pointer;
        }
        .app-header .icons {
            display: flex;
            gap: 20px;
            color: #848e9c;
            font-size: 24px;
            cursor: pointer;
        }
        .wallet-content {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .wallet-label {
            color: #f0b90b;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 16px;
        }
        .balance-box {
            background: #1e2329;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #2b313a;
            margin-bottom: 20px;
            text-align: center;
        }
        .balance-title {
            color: #848e9c;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .balance-value {
            color: #f0b90b;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .balance-fiat {
            color: #848e9c;
            font-size: 13px;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .btn-deposit {
            flex: 1;
            background-color: #0ecb81;
            color: #000;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
        .btn-withdraw {
            flex: 1;
            background-color: #f6465d;
            color: #fff;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: #181a20;
            border-top: 1px solid #23272f;
            padding: 10px 0;
            margin-top: auto;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #848e9c;
            font-size: 12px;
            gap: 4px;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }
        .nav-item span:first-child {
            font-size: 20px;
        }
        .nav-item.active {
            color: #f0b90b;
        }

        /* Modal Overlay for Deposit */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 50;
            overflow-y: auto;
        }
        .modal-overlay.active {
            display: flex;
        }
        .deposit-card-box {
            background: #1e2329;
            width: 100%;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2b313a;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            position: relative;
        }
        .close-modal-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: #848e9c;
            font-size: 20px;
            cursor: pointer;
        }
        .network-section {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2b313a;
        }
        .network-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .network-title {
            color: #f0b90b;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 14px;
        }
        .qr-container {
            display: flex;
            justify-content: center;
            margin-bottom: 14px;
        }
        .qr-box {
            background: #ffffff;
            padding: 8px;
            border-radius: 8px;
            width: 130px;
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .address-box {
            background: #2b313a;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
            margin-bottom: 10px;
            color: #eaecef;
            border: 1px solid #363c4e;
        }
        .copy-btn {
            width: 100%;
            background-color: #f0b90b;
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .copy-btn:active {
            background-color: #d4a30a;
        }
        .toast {
            text-align: center;
            font-size: 11px;
            color: #0ecb81;
            margin-top: 4px;
            height: 14px;
        }

        /* Generic Alert Modal for other buttons */
        .alert-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 60;
        }
        .alert-overlay.active {
            display: flex;
        }
        .alert-box {
            background: #1e2329;
            width: 100%;
            max-width: 320px;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2b313a;
            text-align: center;
        }
        .alert-title {
            color: #f0b90b;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .alert-text {
            color: #848e9c;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .alert-btn {
            background-color: #f0b90b;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Header -->
    <div class="app-header">
        <div class="left" onclick="showAlert('Menu', 'Navigation menu options.')">
            <span>✕</span>
            <span>One P2p</span>
        </div>
        <div class="icons">
            <span onclick="showAlert('Network Gateway', 'Network gateway status is secure.')">⌄</span>
            <span onclick="showAlert('Options', 'Additional settings and configurations.')">⋮</span>
        </div>
    </div>

    <!-- Original Wallet Page Content -->
    <div class="wallet-content">
        <div class="wallet-label">Wallet</div>
        <div class="balance-box">
            <div class="balance-title">Estimated Total Balance</div>
            <div class="balance-value">72.51 USDT</div>
            <div class="balance-fiat">≈ 14,102.34 ETB</div>
        </div>
        <div class="action-buttons">
            <button class="btn-deposit" onclick="openDepositModal()">Deposit</button>
            <button class="btn-withdraw" onclick="showAlert('Withdraw USDT', 'Your request to withdraw funds is being initialized securely through the network gateway.')">Withdraw</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <button class="nav-item" onclick="showAlert('Home', 'Redirecting to Home page.')">
            <span>🏠</span>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="showAlert('Orders', 'Opening your active and past orders.')">
            <span>📋</span>
            <span>Orders</span>
        </button>
        <button class="nav-item" onclick="showAlert('Ads', 'Loading P2P advertisements market.')">
            <span>📢</span>
            <span>Ads</span>
        </button>
        <button class="nav-item active" onclick="showAlert('Wallet', 'You are already on the Wallet page.')">
            <span>👛</span>
            <span>Wallet</span>
        </button>
        <button class="nav-item" onclick="showAlert('Help', 'Connecting you to support center.')">
            <span>❓</span>
            <span>Help</span>
        </button>
    </div>

    <!-- Deposit Popup Modal -->
    <div class="modal-overlay" id="depositModal" onclick="closeOnOutside(event)">
        <div class="deposit-card-box">
            <button class="close-modal-btn" onclick="closeDepositModal()">✕</button>
            
            <!-- Solana Section -->
            <div class="network-section">
                <div class="network-title">Solana (SPL) Network</div>
                <div class="qr-container">
                    <div class="qr-box">
                        <img src="Screenshot_2026-08-28_134649.682.jpg" alt="Solana QR">
                    </div>
                </div>
                <div class="address-box" id="sol-address">H49kEYE5F1hnMPwiyJrSr51Ya44ySRaQW1FhE2gWEvmY</div>
                <button class="copy-btn" onclick="copyAddress('H49kEYE5F1hnMPwiyJrSr51Ya44ySRaQW1FhE2gWEvmY', 'sol-toast')">Copy Address</button>
                <div class="toast" id="sol-toast"></div>
            </div>

            <!-- BSC Section -->
            <div class="network-section">
                <div class="network-title">BSC (BEP20) Network</div>
                <div class="qr-container">
                    <div class="qr-box">
                        <img src="Screenshot_2026-08-28_134632.444.jpg" alt="BSC QR">
                    </div>
                </div>
                <div class="address-box" id="bsc-address">0x8e54105bed3243e1ca44a0cccc6b62cf2bff9df4</div>
                <button class="copy-btn" onclick="copyAddress('0x8e54105bed3243e1ca44a0cccc6b62cf2bff9df4', 'bsc-toast')">Copy Address</button>
                <div class="toast" id="bsc-toast"></div>
            </div>
        </div>
    </div>

    <!-- General Alert Modal for Other Buttons -->
    <div class="alert-overlay" id="alertModal">
        <div class="alert-box">
            <div class="alert-title" id="alertTitle">Notice</div>
            <div class="alert-text" id="alertText">Action executed successfully.</div>
            <button class="alert-btn" onclick="closeAlert()">Close</button>
        </div>
    </div>
</div>

<script>
    function openDepositModal() {
        document.getElementById('depositModal').classList.add('active');
    }

    function closeDepositModal() {
        document.getElementById('depositModal').classList.remove('active');
    }

    function closeOnOutside(event) {
        if (event.target === document.getElementById('depositModal')) {
            closeDepositModal();
        }
    }

    function showAlert(title, text) {
        document.getElementById('alertTitle').innerText = title;
        document.getElementById('alertText').innerText = text;
        document.getElementById('alertModal').classList.add('active');
    }

    function closeAlert() {
        document.getElementById('alertModal').classList.remove('active');
    }

    function copyAddress(text, toastId) {
        navigator.clipboard.writeText(text).then(() => {
            const toast = document.getElementById(toastId);
            toast.innerText = "Address copied to clipboard!";
            setTimeout(() => {
                toast.innerText = "";
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy: ', err);
        });
    }
</script>

</body>
</html>
