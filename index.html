<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Buy USDT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0b0e11;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }

        .card {
            background-color: #181a20;
            border: 1px solid #2b313a;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .header h2 {
            font-size: 18px;
            color: #ffffff;
        }

        .seller-info {
            background: #1e2329;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            font-size: 13px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            color: #848e9c;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-value {
            color: #eaecef;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            color: #848e9c;
            margin-bottom: 6px;
        }

        .input-container {
            background-color: #2b313a;
            border: 1px solid #363c4e;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding: 10px 12px;
            transition: border-color 0.2s;
        }

        .input-container:focus-within {
            border-color: #f0b90b;
        }

        .input-container input {
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 16px;
            width: 100%;
        }

        .input-container .unit {
            color: #f0b90b;
            font-weight: bold;
            font-size: 14px;
            margin-left: 8px;
        }

        .calculation-box {
            background-color: #1e2329;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .calculation-box .label {
            font-size: 12px;
            color: #848e9c;
            margin-bottom: 4px;
        }

        .calculation-box .amount {
            font-size: 20px;
            font-weight: bold;
            color: #f0b90b;
        }

        .error-message {
            color: #f6465d;
            font-size: 12px;
            min-height: 16px;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .btn-submit {
            width: 100%;
            background-color: #0ecb81;
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-submit:disabled {
            background-color: #2b313a;
            color: #848e9c;
            cursor: not-allowed;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>Buy USDT</h2>
    </div>

    <div class="seller-info">
        <div class="info-row">
            <span>Price:</span>
            <span class="info-value">193.90 ETB</span>
        </div>
        <div class="info-row">
            <span>Min Limit:</span>
            <span class="info-value">1,000.00 ETB (~5.16 USD)</span>
        </div>
        <div class="info-row">
            <span>Max Limit:</span>
            <span class="info-value">10,000.00 ETB (~51.57 USD)</span>
        </div>
    </div>

    <div class="form-group">
        <label for="usdInput">Amount in USD</label>
        <div class="input-container">
            <input type="number" id="usdInput" placeholder="Enter amount" step="any">
            <span class="unit">USD</span>
        </div>
    </div>

    <div class="calculation-box">
        <div class="label">You will pay</div>
        <div class="amount" id="etbOutput">0.00 ETB</div>
    </div>

    <div class="error-message" id="errorMessage"></div>

    <button class="btn-submit" id="buyBtn" disabled>Buy USDT</button>
</div>

<script>
    // System Constants
    const EXCHANGE_RATE = 193.90;
    const MIN_LIMIT_ETB = 1000;
    const MAX_LIMIT_ETB = 10000;

    // DOM Elements
    const usdInput = document.getElementById('usdInput');
    const etbOutput = document.getElementById('etbOutput');
    const errorMessage = document.getElementById('errorMessage');
    const buyBtn = document.getElementById('buyBtn');

    // Live Input Event Handler
    usdInput.addEventListener('input', function() {
        const usdVal = parseFloat(this.value);

        // Check for empty or non-numeric input
        if (isNaN(usdVal) || this.value.trim() === '' || usdVal <= 0) {
            etbOutput.innerText = '0.00 ETB';
            errorMessage.innerText = '';
            buyBtn.disabled = true;
            return;
        }

        // Calculate total ETB equivalent
        const totalEtb = usdVal * EXCHANGE_RATE;
        etbOutput.innerText = totalEtb.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ETB';

        // Limit Checks
        if (totalEtb < MIN_LIMIT_ETB) {
            errorMessage.innerText = `Below minimum limit of ${MIN_LIMIT_ETB.toLocaleString()} ETB.`;
            buyBtn.disabled = true;
        } else if (totalEtb > MAX_LIMIT_ETB) {
            errorMessage.innerText = `Exceeds maximum limit of ${MAX_LIMIT_ETB.toLocaleString()} ETB.`;
            buyBtn.disabled = true;
        } else {
            errorMessage.innerText = '';
            buyBtn.disabled = false; // Enable submit button when strictly inside bounds
        }
    });

    // Submit Handler
    buyBtn.addEventListener('click', function() {
        if (!this.disabled) {
            alert(`Order submitted! You will pay ${etbOutput.innerText} for ${usdInput.value} USD.`);
        }
    });
</script>

</body>
</html>
