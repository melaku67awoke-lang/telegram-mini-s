<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One P2p</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0e11;
            color: #ffffff;
            margin: 0;
            padding: 0;
        }
        .app-shell {
            max-width: 420px;
            margin: 0 auto;
            min-height: 100vh;
            background: #181a20;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: #181a20;
            border-bottom: 1px solid #23272f;
        }
        .app-header .left {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 18px;
            font-weight: 600;
        }
        .app-header .icons {
            display: flex;
            gap: 16px;
            color: #848e9c;
            font-size: 20px;
        }
        .wallet-body {
            padding: 20px;
            flex: 1;
            filter: blur(4px);
            pointer-events: none;
            user-select: none;
        }
        .wallet-title {
            color: #f0b90b;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .balance-card {
            background: #1e2329;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            border: 1px solid #2b313a;
            margin-bottom: 20px;
        }
        .balance-label {
            color: #848e9c;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .balance-amount {
            color: #f0b90b;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .balance-fiat {
            color: #848e9c;
            font-size: 14px;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .btn-deposit {
            flex: 1;
            background-color: #0ecb81;
            color: #000;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 8px;
            font-size: 15px;
        }
        .btn-withdraw {
            flex: 1;
            background-color: #f6465d;
            color: #fff;
            border: none;
            padding: 14px;
            font-weight: bold;
            border-radius: 8px;
            font-size: 15px;
        }
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            background: #181a20;
            border-top: 1px solid #23272f;
            padding: 10px 0;
            position: sticky;
            bottom: 0;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #848e9c;
            font-size: 11px;
            gap: 4px;
        }
        .nav-item.active {
            color: #f0b90b;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
            overflow-y: auto;
        }
        .modal-content {
            background: #1e2329;
            width: 100%;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #2b313a;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
        }
        .modal-title {
            color: #f0b90b;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
        }
        .network-section {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #2b313a;
        }
        .network-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }
        .network-name {
            color: #f0b90b;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .qr-container {
            display: flex;
            justify-content: center;
            margin-bottom: 12px;
        }
        .qr-box {
            background: #ffffff;
            padding: 8px;
            border-radius: 8px;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qr-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .address-box {
            background: #2b313a;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
            word-break: break-all;
            margin-bottom: 8px;
            color: #eaecef;
            border: 1px solid #363c4e;
        }
        .copy-btn {
            width: 100%;
            background-color: #f0b90b;
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .copy-btn:active {
            background-color: #d4a30a;
        }
        .toast {
            text-align: center;
            font-size: 11px;
            color: #0ecb81;
            margin-top: 4px;
            height: 12px;
        }
    </style>
</head>
<body>

<div class="app-shell">
    <!-- Header -->
    <div class="app-header">
        <div class="left">
            <span>✕</span>
            <span>One P2p</span>
        </div>
        <div class="icons">
            <span>⌄</span>
            <span>⋮</span>
        </div>
    </div>

    <!-- Main Wallet Background (Blurred) -->
    <div class="wallet-body">
        <div class="wallet-title">Wallet</div>
        <div class="balance-card">
            <div class="balance-label">Estimated Total Balance</div>
            <div class="balance-amount">72.51 USDT</div>
            <div class="balance-fiat">≈ 14,102.34 ETB</div>
        </div>
        <div class="action-buttons">
            <button class="btn-deposit">Deposit</button>
            <button class="btn-withdraw">Withdraw</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item">
            <span>🏠</span>
            <span>Home</span>
        </div>
        <div class="nav-item">
            <span>📋</span>
            <span>Orders</span>
        </div>
        <div class="nav-item">
            <span>📢</span>
            <span>Ads</span>
        </div>
        <div class="nav-item active">
            <span>👛</span>
            <span>Wallet</span>
        </div>
        <div class="nav-item">
            <span>❓</span>
            <span>Help</span>
        </div>
    </div>

    <!-- Deposit Modal Popup Replacing Old Alert -->
    <div class="modal-overlay">
        <div class="modal-content">
            <div class="modal-title">Deposit USDT</div>

            <!-- Solana Section -->
            <div class="network-section">
                <div class="network-name">Solana (SPL) Network</div>
                <div class="qr-container">
                    <div class="qr-box">
                        <img src="Screenshot_2026-08-28_134649.682.jpg" alt="Solana QR Code">
                    </div>
                </div>
                <div class="address-box" id="sol-address">H49kEYE5F1hnMPwiyJrSr51Ya44ySRaQW1FhE2gWEvmY</div>
                <button class="copy-btn" onclick="copyAddress('H49kEYE5F1hnMPwiyJrSr51Ya44ySRaQW1FhE2gWEvmY', 'sol-toast')">Copy Address</button>
                <div class="toast" id="sol-toast"></div>
            </div>

            <!-- BSC Section -->
            <div class="network-section">
                <div class="network-name">BSC (BEP20) Network</div>
                <div class="qr-container">
                    <div class="qr-box">
                        <img src="Screenshot_2026-08-28_134632.444.jpg" alt="BSC QR Code">
                    </div>
                </div>
                <div class="address-box" id="bsc-address">0x8e54105bed3243e1ca44a0cccc6b62cf2bff9df4</div>
                <button class="copy-btn" onclick="copyAddress('0x8e54105bed3243e1ca44a0cccc6b62cf2bff9df4', 'bsc-toast')">Copy Address</button>
                <div class="toast" id="bsc-toast"></div>
            </div>
        </div>
    </div>
</div>

<script>
    function copyAddress(text, toastId) {
        navigator.clipboard.writeText(text).then(() => {
            const toast = document.getElementById(toastId);
            toast.innerText = "Address copied to clipboard!";
            setTimeout(() => {
                toast.innerText = "";
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy: ', err);
        });
    }
</script>

</body>
</html>
