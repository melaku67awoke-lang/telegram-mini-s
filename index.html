<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Wallets</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 400px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .network-section {
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #333;
        }
        .network-section:last-child {
            border-bottom: none;
        }
        h3 {
            margin-top: 0;
            color: #f0b90b;
        }
        .qr-container {
            text-align: center;
            margin-bottom: 15px;
        }
        .qr-container img {
            width: 180px;
            height: 180px;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
        }
        .address-box {
            background: #2b2b2b;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            margin-bottom: 10px;
            border: 1px solid #444;
        }
        .copy-btn {
            width: 100%;
            background-color: #f0b90b;
            color: #000;
            border: none;
            padding: 10px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .copy-btn:hover {
            background-color: #d4a30a;
        }
        .toast {
            text-align: center;
            font-size: 12px;
            color: #0ecb81;
            margin-top: 5px;
            height: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Solana Network Section -->
    <div class="network-section">
        <h3>Solana (SPL) Network</h3>
        <div class="qr-container">
            <!-- QR code from Screenshot_2026-08-28_134649.682.jpg -->
            <img src="Screenshot_2026-08-28_134649.682.jpg" alt="Solana QR Code">
        </div>
        <div class="address-box" id="sol-address">H49kEYE5F1hnMPwiyJrSr51Ya44ySRaQW1FhE2gWEvmY</div>
        <button class="copy-btn" onclick="copyAddress('H49kEYE5F1hnMPwiyJrSr51Ya44ySRaQW1FhE2gWEvmY', 'sol-toast')">Copy Address</button>
        <div class="toast" id="sol-toast"></div>
    </div>

    <!-- BSC Network Section -->
    <div class="network-section">
        <h3>BSC (BEP20) Network</h3>
        <div class="qr-container">
            <!-- QR code from Screenshot_2026-08-28_134632.444.jpg -->
            <img src="Screenshot_2026-08-28_134632.444.jpg" alt="BSC QR Code">
        </div>
        <div class="address-box" id="bsc-address">0x8e54105bed3243e1ca44a0cccc6b62cf2bff9df4</div>
        <button class="copy-btn" onclick="copyAddress('0x8e54105bed3243e1ca44a0cccc6b62cf2bff9df4', 'bsc-toast')">Copy Address</button>
        <div class="toast" id="bsc-toast"></div>
    </div>
</div>

<script>
    function copyAddress(text, toastId) {
        navigator.clipboard.writeText(text).then(() => {
            const toast = document.getElementById(toastId);
            toast.innerText = "Address copied to clipboard!";
            setTimeout(() => {
                toast.innerText = "";
            }, 2000);
        }).catch(err => {
            console.error('Failed to copy: ', err);
        });
    }
</script>

</body>
</html>
