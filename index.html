<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One P2P - Register</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: auto; }
        h2 { color: #f0b90b; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 14px; margin-bottom: 5px; color: #aaa; }
        input, select { width: 100%; padding: 12px; background-color: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: white; box-sizing: border-box; }
        .btn { background-color: #f0b90b; color: #000; width: 100%; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 20px; }
        .note { font-size: 12px; color: #888; margin-top: 15px; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="welcome-screen" class="container" style="text-align: center; padding-top: 60px;">
        <h1 style="color: #f0b90b;">One P2P</h1>
        <p>A community-based peer-to-peer trading platform.</p>
        <button class="btn" onclick="showRegister()">Get Started →</button>
    </div>

    <div id="register-screen" class="container" style="display: none;">
        <h2>Register</h2>
        <p style="font-size: 14px; color: #aaa;">Step 1 of 2: Complete your basic information</p>
        
        <div class="form-group">
            <label>Nickname *</label>
            <input type="text" id="nickname" placeholder="Enter nickname">
        </div>
        <div class="form-group">
            <label>Full Name * (As it appears on National ID)</label>
            <input type="text" id="fullname" placeholder="Enter full name">
        </div>
        <div class="form-group">
            <label>Email *</label>
            <input type="email" id="email" placeholder="name@example.com">
        </div>
        <div class="form-group">
            <label>Country *</label>
            <input type="text" value="🇪🇹 Ethiopia" readonly style="background: #181818;">
        </div>
        <div class="form-group">
            <label>Phone Number *</label>
            <input type="text" id="phone" placeholder="912345678">
        </div>
        <div class="form-group">
            <label>Currency *</label>
            <input type="text" value="🇪🇹 Ethiopian Birr (ETB)" readonly style="background: #181818;">
        </div>
        <div class="form-group">
            <label>Binance ID *</label>
            <input type="text" id="binanceid" placeholder="Enter your Binance ID">
        </div>

        <button class="btn" onclick="alert('Registration submitted successfully!')">Continue to Step 2 →</button>
        
        <div class="note">
            Note: You must have a verified Binance account registered before March 2025 to join this platform.
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function showRegister() {
            document.getElementById('welcome-screen').style.display = 'none';
            document.getElementById('register-screen').style.display = 'block';
        }
    </script>
</body>
</html>
